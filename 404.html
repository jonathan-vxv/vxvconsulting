<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | VXV Consulting</title>
<script>
  // GitHub Pages paths are case-sensitive; send /brm, /Brm, /brm/ etc. to the real /BRM/ page.
  (function () {
    var p = location.pathname;
    if (/^\/brm\/?$/i.test(p) || /^\/brm\/index\.html$/i.test(p)) {
      location.replace('/BRM/' + location.search + location.hash);
    }
  })();
</script>

  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf9f5; color: #23221e;

  h1 { font-size: 2rem; letter-spacing: -.02em; margin: 0 0 8px; }
  p { color: #77746a; margin: 0 0 16px; }
  a { color: #0071e3; text-decoration: none; }
</style>
</head>
<body>

    <h1>Page not found</h1>
