<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#faf9f5">
<title>Payment Waterfall | C&amp;L Builders</title>
<style>
  :root {
    --bg: #faf9f5; --bg-alt: #f0eee6; --ink: #23221e; --ink-dim: #77746a;
    --blue: #0071e3; --blue-dim: #0058b0; --line: #ddd9cc; --neg: #b3261e; --pos: #1e7a3c;
    --neg-bg: #fdecea; --pos-bg: #e6f4ea; --card: #fff;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.4; -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; background: var(--bg); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
  .brand { font-weight: 600; font-size: .95rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
  button { font: inherit; cursor: pointer; }
  .link { background: none; border: 0; color: var(--blue); font-size: .85rem; padding: 8px 0; }
  .status { font-size: .8rem; font-weight: 600; padding: 5px 12px; border-radius: 980px; background: var(--bg-alt); color: var(--ink-dim); white-space: nowrap; }
  .status.saving { background: #e8f0fb; color: var(--blue-dim); }
  .status.saved { background: var(--pos-bg); color: var(--pos); }
  .status.error { background: var(--neg-bg); color: var(--neg); }
  .status.dry { background: #fff4d6; color: #7a5a00; }

  main { padding: 20px 0 60px; }
  h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0; }
  .meta { color: var(--ink-dim); font-size: .8rem; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 2px 0 16px; }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: .88rem; font-weight: 600; margin-bottom: 14px; }
  .banner.err { background: var(--neg-bg); color: var(--neg); }
  .banner.info { background: #fff4d6; color: #7a5a00; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  .tile { background: var(--bg-alt); border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .tile .l { font-size: .68rem; font-weight: 600; letter-spacing: .05em; color: var(--ink-dim); text-transform: uppercase; }
  .tile .v { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile .n { font-size: .75rem; color: var(--ink-dim); }
  .tile.state { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tile.state .l { display: none; }
  .tile.ok { background: var(--pos-bg); } .tile.ok .v { color: var(--pos); }
  .tile.short { background: var(--neg-bg); } .tile.short .v { color: var(--neg); }
  .neg { color: var(--neg); } .pos { color: var(--pos); }

  h2 { font-size: .72rem; font-weight: 600; letter-spacing: .06em; color: var(--ink-dim); margin: 0 0 8px; text-transform: uppercase; }
  ol { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 12px; margin-bottom: 8px; transition: background-color .4s; }
  .item.short { background: var(--neg-bg); border-color: #f2c4bf; }
  .item.in { background: var(--pos-bg); border-color: #b9dfc4; }
  .item.flash { box-shadow: 0 0 0 2px var(--blue); }
  .step { font-size: .8rem; font-weight: 700; color: var(--ink-dim); text-align: center; font-variant-numeric: tabular-nums; }
  .body { min-width: 0; }
  .vendor { font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
  .proj { font-size: .78rem; color: var(--ink-dim); }
  .nums { display: flex; gap: 12px; font-size: .85rem; margin-top: 3px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .nums .bal { color: var(--ink-dim); }
  .nums .bal b { font-weight: 600; color: var(--ink); }
  .item.short .nums .bal b { color: var(--neg); }
  .moves { display: flex; flex-direction: column; gap: 6px; }
  .mv { width: 48px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-size: 1.1rem; line-height: 1; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .mv:active { background: var(--bg-alt); }
  .mv:disabled { opacity: .3; cursor: default; }
  .foot { color: var(--ink-dim); font-size: .75rem; text-align: center; margin-top: 18px; }
  #loading { color: var(--ink-dim); text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="brand">C&amp;L Builders</span>
  <span class="status" id="status">Loading…</span>
  <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
</div></header>

<main><div class="wrap">
  <h1>Payment waterfall</h1>
  <div class="meta"><span id="updated"></span><button class="link" id="refresh" type="button">Reload from sheet</button></div>
  <div id="banner" class="banner" hidden></div>
  <div id="loading">Loading the sheet…</div>
  <div id="content" hidden>
    <div class="tiles" id="tiles"></div>
    <h2>Payment order</h2>
    <ol id="list"></ol>
    <p class="foot">Use ▲ ▼ to change the order. Each move saves to the Google Sheet. Amounts are edited in the sheet itself.</p>
  </div>
</div></main>
<script src="/app.js"></script>
</body>
</html>
